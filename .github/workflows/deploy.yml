name: Test and deploy to sysadmin.rouages.net

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Two jobs side by side: the unit tests, and the build checked in
  # Chromium. The deployment waits for both.
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  test:
    name: Build, budget and Chromium checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The build checked in Chromium has no statistics server: no request
      # may leave the site (see docs/DEPLOYMENT.md, "Statistics"). The
      # variables are set empty on purpose, whatever the runner has.
      - name: Build (without statistics)
        run: npm run build
        env:
          PUBLIC_UMAMI_HOST: ''
          PUBLIC_UMAMI_SITE_ID: ''
          PUBLIC_UMAMI_EMBED_ID: ''
      # Playwright's Chromium, kept between runs for the same Playwright version
      # (its system libraries are installed on each run).
      - name: Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # tests/browser.mjs and tests/a11y.mjs (npm run test:browser) side by
      # side, each with its own browser: they mostly wait on pages, not on
      # the processor. Each log is printed whole, then both must pass.
      - name: Check in Chromium (1000 and 375 px, CSP, embedding, PWA, accessibility)
        run: |
          npm run preview &
          for i in $(seq 30); do curl -fs -o /dev/null http://localhost:4340/ && break; sleep 1; done
          node tests/browser.mjs > browser.log 2>&1 & browser=$!
          node tests/a11y.mjs > a11y.log 2>&1 & a11y=$!
          status=0
          wait $browser || status=1
          wait $a11y || status=1
          echo "::group::tests/browser.mjs"; cat browser.log; echo "::endgroup::"
          echo "::group::tests/a11y.mjs"; cat a11y.log; echo "::endgroup::"
          tail -n 5 browser.log a11y.log
          exit $status
      # What is deployed (main only): the same build, with the anonymous
      # visit statistics when the repository's variables give a server and
      # the websites' ids (Settings → Secrets and variables → Actions →
      # Variables; not secrets: they end up in the public JavaScript).
      # Without them, statistics stay off.
      - name: Build for deployment (with the statistics' variables)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_UMAMI_HOST: ${{ vars.PUBLIC_UMAMI_HOST }}
          PUBLIC_UMAMI_SITE_ID: ${{ vars.PUBLIC_UMAMI_SITE_ID }}
          PUBLIC_UMAMI_EMBED_ID: ${{ vars.PUBLIC_UMAMI_EMBED_ID }}
        run: |
          npm run build
          if [ -n "$PUBLIC_UMAMI_HOST" ]; then
            grep -q "connect-src 'self' https://" dist/.htaccess
            echo "::notice::Statistics on: $(grep -o "connect-src 'self' [^;]*" dist/.htaccess)"
          else
            echo "::notice::No PUBLIC_UMAMI_HOST variable: statistics off."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true # .htaccess

  deploy:
    needs: [unit, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sysadmin.rouages.net
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      # Until the secrets are set (see docs/DEPLOYMENT.md), don't deploy,
      # without failing the workflow.
      - name: Secrets present?
        id: secrets
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::FTP secrets missing: deployment skipped (see docs/DEPLOYMENT.md)."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'yes'
        with:
          name: dist
          path: dist/
      - name: Upload over FTPS
        if: steps.secrets.outputs.ready == 'yes'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
      - name: Check the live site
        if: steps.secrets.outputs.ready == 'yes'
        run: |
          set -eu
          SITE=https://sysadmin.rouages.net
          for i in 1 2 3 4 5; do curl -fsS -o /dev/null "$SITE/en/" && break; sleep 10; done
          curl -fsS "$SITE/en/" | grep -q '<quetes-de-sysadmin'
          curl -fsS "$SITE/fr/" | grep -q '<quetes-de-sysadmin'
          # The root picks the language from the browser.
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: fr-FR,fr;q=0.9' "$SITE/")" = "$SITE/fr/"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: en-GB,en;q=0.9' "$SITE/")" = "$SITE/en/"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/enseignants/")" = 301
          curl -fsSI "$SITE/integration/quetes-de-sysadmin.js" | grep -qi '^access-control-allow-origin: \*'
          curl -fsSI "$SITE/en/" | grep -qi '^content-security-policy:'
          # The installable game: its service worker and its manifest.
          curl -fsSI "$SITE/sw.js" | grep -qi '^content-type: .*javascript'
          curl -fsSI "$SITE/en/manifest.webmanifest" | grep -qi '^content-type: application/manifest+json'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/no-such-page/")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/.ftp-deploy-sync-state.json")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://sysadmin.rouages.net/")" = 301
          echo "Site online: $SITE"
