name: Tester et déployer sur sysadmin.rouages.net

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Vérifier dans Chromium (1000 et 375 px, CSP, intégration)
        run: |
          npx playwright install --with-deps chromium
          npm run preview &
          for i in $(seq 30); do curl -fs -o /dev/null http://localhost:4340/ && break; sleep 1; done
          npm run test:navigateur
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true # .htaccess

  deployer:
    needs: tester
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sysadmin.rouages.net
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      # Tant que les secrets ne sont pas renseignés (voir docs/DEPLOYMENT.md),
      # on ne déploie pas, sans faire échouer le workflow.
      - name: Secrets présents ?
        id: secrets
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::Secrets FTP absents : déploiement ignoré (voir docs/DEPLOYMENT.md)."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.pret == 'oui'
        with:
          name: dist
          path: dist/
      - name: Envoi FTPS
        if: steps.secrets.outputs.pret == 'oui'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
      - name: Vérifier le site en ligne
        if: steps.secrets.outputs.pret == 'oui'
        run: |
          set -eu
          SITE=https://sysadmin.rouages.net
          for i in 1 2 3 4 5; do curl -fsS -o /dev/null "$SITE/en/" && break; sleep 10; done
          curl -fsS "$SITE/en/" | grep -q '<quetes-de-sysadmin'
          curl -fsS "$SITE/fr/" | grep -q '<quetes-de-sysadmin'
          # The root picks the language from the browser.
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: fr-FR,fr;q=0.9' "$SITE/")" = "$SITE/fr/"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: en-GB,en;q=0.9' "$SITE/")" = "$SITE/en/"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/enseignants/")" = 301
          curl -fsSI "$SITE/integration/quetes-de-sysadmin.js" | grep -qi '^access-control-allow-origin: \*'
          curl -fsSI "$SITE/en/" | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/n-existe-pas/")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/.ftp-deploy-sync-state.json")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://sysadmin.rouages.net/")" = 301
          echo "Site en ligne : $SITE"
