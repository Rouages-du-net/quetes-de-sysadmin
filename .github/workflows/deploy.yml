name: Test and deploy to sysadmin.rouages.net

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check in Chromium (1000 and 375 px, CSP, embedding)
        run: |
          npx playwright install --with-deps chromium
          npm run preview &
          for i in $(seq 30); do curl -fs -o /dev/null http://localhost:4340/ && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true # .htaccess

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sysadmin.rouages.net
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      # Until the secrets are set (see docs/DEPLOYMENT.md), don't deploy,
      # without failing the workflow.
      - name: Secrets present?
        id: secrets
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::FTP secrets missing: deployment skipped (see docs/DEPLOYMENT.md)."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'yes'
        with:
          name: dist
          path: dist/
      - name: Upload over FTPS
        if: steps.secrets.outputs.ready == 'yes'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
      - name: Check the live site
        if: steps.secrets.outputs.ready == 'yes'
        run: |
          set -eu
          SITE=https://sysadmin.rouages.net
          for i in 1 2 3 4 5; do curl -fsS -o /dev/null "$SITE/en/" && break; sleep 10; done
          curl -fsS "$SITE/en/" | grep -q '<quetes-de-sysadmin'
          curl -fsS "$SITE/fr/" | grep -q '<quetes-de-sysadmin'
          # The root picks the language from the browser.
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: fr-FR,fr;q=0.9' "$SITE/")" = "$SITE/fr/"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: en-GB,en;q=0.9' "$SITE/")" = "$SITE/en/"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/enseignants/")" = 301
          curl -fsSI "$SITE/integration/quetes-de-sysadmin.js" | grep -qi '^access-control-allow-origin: \*'
          curl -fsSI "$SITE/en/" | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/no-such-page/")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/.ftp-deploy-sync-state.json")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://sysadmin.rouages.net/")" = 301
          echo "Site online: $SITE"
